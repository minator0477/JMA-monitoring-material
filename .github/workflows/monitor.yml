name: Monitor JMA PDFs

on:
  schedule:
    # 20:03 UTC = 5:03 JST(毎日)。毎時00分ちょうどはGitHub Actions側の負荷が高くスケジュールイベントが
    # ドロップされることがあるため、数分ずらして実行する。
    - cron: "3 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-jma-pdfs
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python scripts/monitor.py

      - name: Commit and push new PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d downloads ] && git add downloads
          [ -f state/downloaded.json ] && git add state/downloaded.json
          [ -f state/bulletins.json ] && git add state/bulletins.json
          if git diff --cached --quiet; then
            echo "No new PDFs"
          else
            git commit -m "chore: add new JMA PDF(s) $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify.py
