# 監視対象の気象庁ページ一覧。
#
# type: pdf_list (デフォルト) | js_array_list | json_bulletin | json_probability
#   pdf_list         … ページ内の <a href="*.pdf"> を新着PDFとして検知・ダウンロードする
#   js_array_list    … 気象庁の報道発表資料一覧が使うJS配列(press_list.js等)から新着リンクを検知する
#   json_bulletin     … JSON(単一オブジェクト)の reportDatetime の変化で新しい発表を検知する(季節予報など)
#   json_probability … JSON(ネストした配列)内の全 reportDatetime の最大値の変化で新しい発表を検知する(早期注意情報など)
# js_array_list・json系はいずれもダウンロードはしない。
#
# id: ダウンロード先フォルダ名やstateのキーにも使われる一意なID(英数字推奨)
# name: 通知メッセージなどで使う表示名
# url: 監視に使うURL(pdf_listはページURL、json系はJSON APIのURL)
# web_url: (json系のみ) 通知に載せる、人が見るためのページURL
targets:
  - id: extreme_japan
    type: pdf_list
    name: 日本の異常気象
    url: https://www.data.jma.go.jp/cpd/longfcst/extreme_japan/index.html

  - id: season_1month
    type: json_bulletin
    name: 1か月予報(全国)
    url: https://www.jma.go.jp/bosai/season/data/P1M/010000.json
    web_url: "https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=temperature&pattern=P1M&term=0&contents=season"

  - id: season_3month
    type: json_bulletin
    name: 3か月予報(全国)
    url: https://www.jma.go.jp/bosai/season/data/P3M/010000.json
    web_url: "https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=temperature&pattern=P3M&term=0&contents=season"

  - id: season_6month
    type: json_bulletin
    name: 暖候期・寒候期予報(全国)
    url: https://www.jma.go.jp/bosai/season/data/P6M/010000.json
    web_url: "https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=temperature&pattern=P6M&term=0&contents=season"

  # 報道発表資料一覧(https://www.jma.go.jp/jma/press/index.html?t=1&y=08)は年別ページで、
  # かつ一覧はJSで動的描画されるため静的HTMLにはリンクが現れない。
  # ページが読み込む press_list.js が実データで、年をまたいでも直近の発表が
  # ローリングで格納されているため、年パラメータを気にせずこちらを直接監視する。
  - id: press_release
    type: js_array_list
    name: 報道発表資料
    url: https://www.jma.go.jp/jma/press_list.js

  - id: early_warning
    type: json_probability
    name: 早期注意情報(警報級の可能性)
    url: https://www.jma.go.jp/bosai/probability/data/probability/r8/map.json
    web_url: "https://www.jma.go.jp/bosai/map.html#5/34.5/137/&elem=all&contents=probability"
